# nginx server config for the Executive Report Web Platform (static site).
# Non-root nginx listens on 8080; put TLS + SSO on the internal reverse proxy in front.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    autoindex      off;   # no directory listing
    server_tokens  off;   # hide nginx version

    # --- Security headers (also enforce equivalents at the reverse proxy) ---
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy. Default = locked down; external origins are only the
    # Google Fonts CDN. For a fully origin-free CSP, self-host the fonts and drop the
    # two fonts.* origins below.
    # NOTE: the optional *browser-side* PDF extraction on the admin page additionally
    # needs `script-src https://cdn.jsdelivr.net` and `connect-src https://api.anthropic.com`.
    # Leave those OUT unless that feature is deliberately enabled.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Correct MIME type for the web app manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Never cache the service worker so updates propagate immediately.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Cache immutable static assets.
    location ~* \.(css|js|png|svg|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static file serving; return 404 for unknown paths.
    location / {
        try_files $uri $uri/ =404;
    }
}
